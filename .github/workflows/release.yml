name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - beta
          - latest

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      # Required to create the draft release and upload its assets.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder.yml has no fixed `publish.channel`: whether it writes
      # `latest.yml` or `beta.yml` (and whether electron-updater's `allowPrerelease`
      # accepts it — see src/main/updates/updater.ts) is decided by whether the version
      # being built carries a prerelease tag. `--no-git-tag-version` keeps this to the
      # checked-out workspace; nothing is pushed back to the repository.
      - name: Set release version
        shell: bash
        working-directory: apps/desktop
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            npm version --no-git-tag-version prerelease --preid=beta
          else
            npm version --no-git-tag-version patch
          fi
        env:
          CHANNEL: ${{ github.event.inputs.channel }}

      - name: Build and release desktop app
        env:
          # electron-builder reads GH_TOKEN; the default job token is enough to
          # publish to this repository's own releases. `--publish always` has
          # electron-builder itself create the (draft) GitHub Release from the version
          # set above and upload the installer plus the updater feed file to it — a
          # second, separate release step here would only create a duplicate.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO: Uncomment when code signing certificate is available (Phase 14)
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm --filter @retenia/desktop run release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts-${{ github.event.inputs.channel }}
          path: apps/desktop/dist/
          retention-days: 30
          if-no-files-found: ignore
