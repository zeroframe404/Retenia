name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `turbo run <task> --affected` can resolve a base ref.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          # Electron caches to ~/.cache/electron on Linux/macOS and to
          # %LOCALAPPDATA%\electron\Cache on Windows, which is the primary target.
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check licenses
        run: pnpm run licenses:check

      - name: Check i18n key parity
        run: pnpm run i18n:check

      - name: Check WCAG 2.2 AA token contrast
        run: pnpm run contrast:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check activity JSON Schemas (Claude strict mode)
        run: pnpm run schema:check

      - name: Test
        run: pnpm test

      - name: Test with coverage
        # One leg is enough: coverage is a report, not a platform-specific behavior check
        # (that's what the full matrix's plain `pnpm test` above is for).
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: windows-latest
    needs: lint-typecheck-test

    steps:
      - uses: actions/checkout@v4

      # Every PR run of this job (before this fix) showed the exact same ~47-50 minute silent
      # stall between the build task's log group closing and the next turbo task starting —
      # right where turbo/electron-builder write and read back thousands of small files (the
      # unpacked Electron/Chromium runtime, node_modules, the NSIS installer). Windows Defender's
      # real-time protection scans each file synchronously on access, which is a well-documented
      # cause of exactly this kind of 10-50x slowdown for operations over many small files on
      # windows-latest runners. Excluding the workspace before any of that happens is the
      # standard fix; it costs nothing if Defender wasn't actually the bottleneck.
      - name: Exclude the workspace from Windows Defender scanning
        shell: pwsh
        continue-on-error: true
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `electron`'s own postinstall only unpacks its binary lazily the first time something
      # `require()`s it. Left unforced, that first `require` happens inside Playwright's own
      # `_electron.launch()` — a *synchronous* download (`spawnSync`) that blocks the whole test
      # process's event loop, so every queued test's timer only fires once it finally returns,
      # reporting a burst of identical "Test timeout ... setting up electronApp" failures instead
      # of one clear, fast error. Forcing it here, right after install, keeps a genuine download
      # failure isolated to this one step instead of silently swallowing the whole test run.
      - name: Verify Electron binary is installed
        shell: bash
        working-directory: apps/desktop
        run: node -e "console.log(require('electron'))"

      # `--no-cache` skips turbo writing its local cache artifacts for `build`/`e2e`'s outputs
      # (`dist/**`, `out/**`, `playwright-report/**`, `test-results/**`) — for `apps/desktop`
      # that's an unpacked Electron/Chromium runtime plus the NSIS installer, many thousands of
      # small files. A CI runner is destroyed after the job and nothing else reads `.turbo/cache`
      # here (no remote cache is configured), so that write is pure, uncompensated cost — and a
      # very plausible second contributor (besides Defender scanning, see above) to the same
      # stall this job kept hitting right after the build task finished.
      - name: Run Playwright E2E (builds first)
        run: pnpm e2e -- --no-cache

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-desktop:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: lint-typecheck-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-build-windows
          path: apps/desktop/dist/
          retention-days: 7
          # apps/desktop does not exist until phase 1.1.
          if-no-files-found: ignore
