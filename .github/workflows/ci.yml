name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `turbo run <task> --affected` can resolve a base ref.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # The cache below must key on the Electron *version* and nothing else. Keying it on
      # `hashFiles('**/package.json')` meant any dependency edit anywhere in the workspace
      # rotated it, even though Electron itself had not moved — and a run that then failed
      # to fetch the binary saved a broken entry under the new key, which every later run on
      # that branch hit exactly instead of falling back to the good prefix. The symptom is
      # brutal and silent: `_electron.launch()` starts a ~460 MB download at test time, no
      # test can finish inside its 30 s budget, and all 49 fail with
      # "timeout ... while setting up electronApp" after ~56 minutes.
      - name: Resolve the Electron version
        id: electron
        shell: bash
        run: |
          echo "version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          # Electron caches to ~/.cache/electron on Linux/macOS and to
          # %LOCALAPPDATA%\electron\Cache on Windows, which is the primary target.
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-cache-${{ steps.electron.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check licenses
        run: pnpm run licenses:check

      - name: Check i18n key parity
        run: pnpm run i18n:check

      - name: Check WCAG 2.2 AA token contrast
        run: pnpm run contrast:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check activity JSON Schemas (Claude strict mode)
        run: pnpm run schema:check

      - name: Test
        run: pnpm test

      - name: Test with coverage
        # One leg is enough: coverage is a report, not a platform-specific behavior check
        # (that's what the full matrix's plain `pnpm test` above is for).
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: windows-latest
    needs: lint-typecheck-test
    # A full run is ~15 minutes. The ceiling exists so a launch failure — every test
    # timing out in turn — is reported in minutes rather than after GitHub's 6-hour default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Keyed on the Electron version alone — see the note in `lint-typecheck-test`.
      - name: Resolve the Electron version
        id: electron
        shell: bash
        run: |
          echo "version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-cache-${{ steps.electron.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm install` reuses electron from the pnpm store and skips its postinstall when it
      # considers the package already built. If that store entry was ever cached WITHOUT
      # `node_modules/electron/dist` — which is what happens when the lockfile key rotates and
      # the first run under the new key fails to extract it — every later run inherits a broken
      # electron, and `_electron.launch()` silently starts a ~460 MB download at test time that
      # no 30 s test can outlast. Re-running the install script costs seconds when the binary is
      # already correct (it short-circuits on the version check) and is what guarantees `dist/`
      # exists no matter how the store got into that state.
      - name: Ensure the Electron binary is extracted
        run: pnpm rebuild electron

      - name: Run Playwright E2E (builds first)
        run: pnpm e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-desktop:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: lint-typecheck-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Keyed on the Electron version alone — see the note in `lint-typecheck-test`.
      - name: Resolve the Electron version
        id: electron
        shell: bash
        run: |
          echo "version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-cache-${{ steps.electron.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-build-windows
          path: apps/desktop/dist/
          retention-days: 7
          # apps/desktop does not exist until phase 1.1.
          if-no-files-found: ignore
