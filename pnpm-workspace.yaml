packages:
  - apps/*
  - packages/*
  - tooling/*
# `rehype-katex@7` depends on `katex@^0.16`, while `packages/ui` depends on `katex@0.18.5`
# directly (`KatexInline`) and ships 0.18.5's stylesheet. Without this, markdown math is rendered
# by 0.16.47 — which emits `base`/`strut`/`mord`/`mopen`/`mclose`/`minner` class names that
# 0.18.5's stylesheet renamed to `katex-base`/`katex-strut` and therefore does not define at all,
# so every `$…$` in a lesson renders unstyled. One katex, one stylesheet.
overrides:
  katex: 0.18.5

allowBuilds:
  esbuild: true
  electron: true
  # Windows Squirrel installer pulled in transitively by electron-builder; we ship NSIS.
  electron-winstaller: false
  # Both SQLite drivers (packages/db) ship N-API prebuilds for every platform inside the
  # tarball; pnpm only flags them because of their binding.gyp. Skipping the implicit
  # `node-gyp rebuild` keeps installs toolchain-free on Windows and CI.
  better-sqlite3: false
  better-sqlite3-multiple-ciphers: false
  # Ships its `dist/` (worker + core wasm loader) prebuilt in the published tarball; its
  # `scripts` field is dev-only build tooling (webpack/rollup), no install-time lifecycle
  # hook actually runs.
  tesseract.js: false
  # `@huggingface/transformers` (packages/ingest) pulls these three in. All are skipped
  # deliberately, and none of them costs us a feature we use:
  #   - onnxruntime-node ships CPU N-API prebuilds for every platform we target
  #     (`bin/napi-v6/{win32,linux,darwin}/{x64,arm64}`) inside the tarball; its postinstall
  #     only fetches the *CUDA* execution-provider binaries from a Nuget feed — hundreds of
  #     megabytes, Linux/Windows x64 only, and a network call in every CI install. The
  #     accelerator is opt-in from the app's AI settings instead (see
  #     `packages/ingest/src/embeddings/device.ts`), which is also the only place that knows
  #     whether the machine has a supported GPU at all.
  #   - sharp is transformers.js's image decoder. We only ever embed text, its own platform
  #     binaries arrive as optional dependencies, and its install script is a check, not a build.
  #   - protobufjs' postinstall only prints a CLI hint.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  # promptfoo (tooling/evals, sub-phase 7.5) pulls both in transitively. Neither costs us a
  # feature we use:
  #   - @swc/core's postinstall only selects among its per-platform optional dependencies
  #     (@swc/core-win32-x64-msvc etc.), which ship prebuilt N-API binaries — the same
  #     "check, not a build" shape as better-sqlite3/sharp above.
  #   - @playwright/browser-chromium's install script downloads a full Chromium (hundreds of
  #     megabytes) for promptfoo's browser-based providers, which our promptfooconfig.yaml
  #     never uses — we only ever route through the custom `role-provider.mjs`.
  '@swc/core': false
  '@playwright/browser-chromium': false
# The FSRS optimizer binding (apps/desktop) ships native N-API prebuilds for every platform
# we target *and* a wasm32-wasi build exposing the same API. npm refuses the WASI package on
# a cpu mismatch; only this pulls it, and it is what keeps the optimizer working on a
# platform with no prebuild.
supportedArchitectures:
  cpu:
    - current
    - wasm32

minimumReleaseAgeExclude:
  - electron@44.1.1
  - '@sentry/electron@7.18.0'
  - '@rive-app/canvas@2.41.1'
  - '@rive-app/react-canvas@4.33.1'
  - konva@10.3.3
  - react-konva@19.2.6
  - katex@0.18.7
  - '@ai-sdk/openai-compatible@3.0.45'
  - '@ai-sdk/provider-utils@5.0.37'
  - '@ai-sdk/provider@4.0.11'
